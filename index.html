<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielplan · Bundesliga & 2. Bundesliga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Default (1. Bundesliga / FC Bayern) Theme */
    --accent: #dc052d;
    --accent-dim: #7a2634;
    --accent-soft: rgba(220,5,45,0.09);
    --trim: #0d2240;
    --bg-a: #24080d;
    --bg-b: #150a10;
    --bg: #0f0708;
    --bg-raise: #1c0f12;
    --line: #3a1e22;
    --text: #f2ede6;
    --text-dim: #a1897f;
    --live: #ff8a3d;
  }
  body.theme-bl2{
    /* 2. Bundesliga / SV Darmstadt 98 Theme */
    --accent: #0057a8;
    --accent-dim: #1f3c63;
    --accent-soft: rgba(0,87,168,0.10);
    --trim: #ffffff;
    --bg-a: #0c1c33;
    --bg-b: #081221;
    --bg: #060d18;
    --bg-raise: #101f34;
    --line: #1c3252;
    --text: #eef2f8;
    --text-dim: #8199bd;
    --live: #ff8a3d;
  }
  body.theme-cup{
    /* Neutrale Ansicht für Pokal-/Europapokalspiele beider Vereine */
    --accent: #d9b34c;
    --accent-dim: #6b5a2a;
    --accent-soft: rgba(217,179,76,0.08);
    --trim: #ffffff;
    --bg-a: #14140f;
    --bg-b: #0d0d0a;
    --bg: #0a0a08;
    --bg-raise: #17160f;
    --line: #2c2a1e;
    --text: #f1efe6;
    --text-dim: #9a9382;
    --live: #ff8a3d;
  }
  body.theme-nt{
    /* Deutschland-Design für die Nationalmannschaft: Schwarz-Rot-Gold */
    --accent: #ffcc02;
    --accent-dim: #7a6a1a;
    --accent-soft: rgba(255,204,2,0.10);
    --trim: #dd0000;
    --bg-a: #1a1005;
    --bg-b: #120b03;
    --bg: #0a0603;
    --bg-raise: #1c1408;
    --line: #332a12;
    --text: #f5f1e6;
    --text-dim: #a79b7a;
    --live: #ff8a3d;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at 15% -10%, var(--bg-a) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, var(--bg-b) 0%, transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px 0;
    transition: background .3s ease;
  }

  .kit-stripe{
    height: 6px;
    width: 100%;
  }
  body:not(.theme-bl2) .kit-stripe{
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 82%, var(--trim) 82%, var(--trim) 100%);
  }
  body.theme-bl2 .kit-stripe{
    background: linear-gradient(90deg, var(--accent) 50%, var(--trim) 50%);
  }
  body.theme-cup .kit-stripe{
    background: linear-gradient(90deg, #dc052d 50%, #0057a8 50%);
  }
  body.theme-nt .kit-stripe{
    background: linear-gradient(90deg, #000000 0%, #000000 33.33%, #dd0000 33.33%, #dd0000 66.66%, #ffcc02 66.66%, #ffcc02 100%);
  }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 0 16px;
  }
  header.top{
    display:flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    gap: 12px;
  }
  header.top .heading{
    display:flex;
    align-items:center;
    gap: 12px;
    min-width: 0;
    flex: 1 1 auto;
  }
  header.top .heading img{
    width: 38px;
    height: 38px;
    object-fit: contain;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,.5));
    flex: none;
  }
  header.top h1{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.2px;
    margin: 0;
    color: var(--text);
    line-height: 1.15;
    min-width: 0;
  }
  header.top h1 .sub{
    display:block;
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.3px;
    margin-top: 2px;
    white-space: normal;
    line-height: 1.35;
    min-height: 2.7em;
  }
  header.top .meta{
    font-size: 11.5px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.5;
    flex: none;
  }
  header.top .meta button{
    background:none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    margin-top: 6px;
    cursor: pointer;
  }
  header.top .meta button:hover{ color: var(--text); border-color: var(--accent-dim); }

  .league-toggle-row{
    display:flex;
    justify-content:flex-end;
    margin: -6px 0 14px 0;
  }
  .league-switch{
    display:inline-grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: var(--line);
    border-radius: 8px;
    padding: 2px;
  }
  .league-switch button{
    display:flex;
    align-items:center;
    justify-content:center;
    background: transparent;
    color: var(--text-dim);
    border: none;
    border-radius: 6px;
    padding: 5px 9px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .league-switch button svg{ width:16px; height:16px; display:block; }
  .league-switch button.active{
    background: var(--bg-raise);
    color: var(--accent);
  }
  .league-switch button:not(.active):hover{ color: var(--text); }

  .league-toggle-row.hidden{ display:none; }

  .weekend-switch{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    background: var(--line);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 16px;
  }
  .weekend-switch button{
    display:flex;
    align-items:center;
    justify-content:center;
    background: transparent;
    border:none;
    color: var(--text-dim);
    padding: 9px 2px;
    border-radius: 8px;
    cursor: pointer;
  }
  .weekend-switch button svg{ width:19px; height:19px; display:block; }
  .weekend-switch button.active{
    background: var(--bg-raise);
    color: var(--accent);
  }
  .weekend-switch button:not(.active):hover{ color: var(--text); }

  .swipe-hint{
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    margin: -10px 0 16px 0;
    letter-spacing: 0.2px;
    opacity: 0.75;
  }

  .day-group{ margin-bottom: 16px; }
  .day-heading{
    display:flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .day-heading .name{
    font-family:'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  .day-heading .date{
    font-size: 12px;
    color: var(--text-dim);
  }
  .day-heading .rule{
    flex:1;
    height:1px;
    background: var(--line);
  }

  .match{
    display:grid;
    grid-template-columns: 1fr 62px 1fr;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    margin: 0 -10px;
    border-bottom: 1px solid var(--line);
    border-radius: 8px;
  }
  .match:last-child{ border-bottom: none; }
  .match.featured{
    background: var(--accent-soft);
    border: 1px solid var(--accent-dim);
    border-bottom: 1px solid var(--accent-dim);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .match.featured .team{ font-weight: 600; }
  .match.featured .kickoff:not(.final):not(.live){ color: var(--text); }

  .team{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.25;
    min-width: 0;
  }
  .team span{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .team img{ width:16px; height:16px; object-fit:contain; flex:none; }
  .team.away{ justify-content:flex-end; text-align: right; }
  .team.away img{ order:2; }
  .team .rank{
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    background: var(--bg-raise);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 4px;
    flex: none;
  }

  .kickoff{
    font-family:'Oswald', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    text-align:center;
    width: 100%;
    padding: 4px 4px;
    border: 1px solid var(--accent-dim);
    border-radius: 6px;
    background: var(--accent-soft);
  }
  .kickoff.final{
    color: var(--text);
    border-color: var(--line);
    background: var(--bg-raise);
    font-size: 14px;
  }
  .kickoff.live{
    color: var(--live);
    border-color: var(--live);
    background: rgba(255,138,61,0.10);
  }
  .kickoff.club-bayern{
    color: #ff7a7a;
    border-color: #7a2634;
    background: rgba(220,5,45,0.10);
  }
  .kickoff.club-darmstadt{
    color: #6badf2;
    border-color: #1f3c63;
    background: rgba(0,87,168,0.12);
  }
  .comp-label{
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 4px 0 2px 2px;
    color: var(--accent);
  }
  .comp-label.club-bayern{ color: #ff7a7a; }
  .comp-label.club-darmstadt{ color: #6badf2; }
  .kickoff .tag{
    display:block;
    font-family:'Inter',sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .note, .status{
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.6;
  }
  .status.error{ color: #e2836a; }

  .table-head, .table-row{
    display:grid;
    grid-template-columns: 22px 20px 1fr 30px 32px 36px;
    align-items:center;
    gap: 6px;
    padding: 7px 10px;
    margin: 0 -10px;
  }
  .table-head{
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .table-row{
    border-bottom: 1px solid var(--line);
    border-radius: 8px;
  }
  .table-row:last-child{ border-bottom: none; }
  .table-row .rank{
    font-family:'Oswald', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
  }
  .table-row img{ width:18px; height:18px; object-fit:contain; }
  .table-row .name{
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .table-head .num, .table-row .num{
    text-align:center;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .table-row .pts{
    text-align:center;
    font-family:'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .table-row.featured{
    background: var(--accent-soft);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .table-row.featured .name{ color: var(--accent); font-weight: 700; }
  .table-row.featured .pts{ color: var(--accent); }
  .spinner{
    display:inline-block;
    width:14px; height:14px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .retry{
    margin-top: 10px;
    background: var(--bg-raise);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'Inter',sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .retry:hover{ border-color: var(--accent-dim); }

  @media (max-width: 420px){
    .team{ font-size: 12.5px; }
    .team img{ width:14px; height:14px; }
    header.top h1{ font-size: 18px; }
    header.top .heading img{ width:32px; height:32px; }
    .weekend-switch button svg{ width:17px; height:17px; }
    .league-switch button svg{ width:14px; height:14px; }
    .match{ grid-template-columns: 1fr 54px 1fr; padding: 6px 8px; gap:6px; }
    .kickoff{ font-size:12.5px; padding: 3px 3px; }
    .kickoff.final{ font-size:13px; }
    .table-head, .table-row{ grid-template-columns: 18px 16px 1fr 24px 28px 30px; padding: 6px 8px; gap:4px; }
    .table-row .name{ font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="kit-stripe"></div>
<div class="wrap">

  <header class="top">
    <div class="heading">
      <img id="club-logo" src="" alt="" style="display:none;">
      <h1 id="page-title">Bundesliga·Spielplan<span class="sub" id="page-sub">1. Bundesliga · im Design des FC Bayern München</span></h1>
    </div>
    <div class="meta">
      <div id="updated-at">wird geladen …</div>
      <button id="refresh-btn">Jetzt aktualisieren</button>
    </div>
  </header>

  <div class="weekend-switch">
    <button id="btn-current" class="active" title="Aktueller Spieltag" aria-label="Aktueller Spieltag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/><circle cx="12" cy="14.5" r="1.9" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="btn-next" title="Nächster Spieltag" aria-label="Nächster Spieltag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
    <button id="btn-table" title="Tabelle" aria-label="Tabelle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h12"/><path d="M4 18h7"/></svg>
    </button>
    <button id="btn-cup" title="Pokalspiele" aria-label="Pokalspiele">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4v1a4 4 0 0 0 4 4"/><path d="M17 5h3v1a4 4 0 0 1-4 4"/><path d="M12 13v3"/><path d="M9 20h6"/><path d="M9.5 16.5h5l.5 3.5h-6z"/></svg>
    </button>
    <button id="btn-nt" title="Nationalmannschaft" aria-label="Nationalmannschaft">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="4.67" fill="#111111"/><rect x="3" y="9.67" width="18" height="4.66" fill="#dd0000"/><rect x="3" y="14.33" width="18" height="4.67" fill="#ffcc02"/></svg>
    </button>
  </div>
  <div class="league-toggle-row" id="league-toggle-row">
    <div class="league-switch">
      <button id="btn-bl1" class="active" title="1. Bundesliga" aria-label="1. Bundesliga">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/><text x="12" y="16.5" text-anchor="middle" font-family="Oswald, sans-serif" font-size="12" font-weight="600" fill="currentColor">1</text></svg>
      </button>
      <button id="btn-bl2" title="2. Bundesliga" aria-label="2. Bundesliga">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/><text x="12" y="16.5" text-anchor="middle" font-family="Oswald, sans-serif" font-size="12" font-weight="600" fill="currentColor">2</text></svg>
      </button>
    </div>
  </div>
  <div class="swipe-hint">← nach links/rechts wischen, um Ansicht zu wechseln →</div>

  <div id="content"></div>

</div>

<script>
const API = 'https://api.openligadb.de';
const LEAGUE_NAMES = { bl1: '1. Bundesliga', bl2: '2. Bundesliga' };
const THEME_CLUB = { bl1: 'FC Bayern München', bl2: 'SV Darmstadt 98' };
const THEME_MATCH = { bl1: 'Bayern München', bl2: 'Darmstadt 98' };

let league = 'bl1';
let weekend = 'current';

// cache[league] = { season, currentOrderId, groups: { [orderId]: {label, matches} }, table: { [teamId]: rank } }
let cache = { bl1: null, bl2: null };

function currentSeason(){
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  return (m >= 7) ? y : y - 1;
}

async function fetchJSON(url){
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function dayName(date){ return date.toLocaleDateString('de-DE', { weekday: 'long', timeZone: 'Europe/Berlin' }); }
function dayDate(date){ return date.toLocaleDateString('de-DE', { day: '2-digit', month: 'short', timeZone: 'Europe/Berlin' }); }
function timeLabel(date){ return date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }); }
function isSameBerlinDay(a, b){
  const fmt = d => d.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
  return fmt(a) === fmt(b);
}

function groupMatchesByDay(matches){
  const days = [];
  matches.slice()
    .sort((a, b) => new Date(a.matchDateTime) - new Date(b.matchDateTime))
    .forEach(m => {
      const dt = new Date(m.matchDateTime);
      let group = days.find(d => isSameBerlinDay(d.refDate, dt));
      if (!group) { group = { refDate: dt, name: dayName(dt), date: dayDate(dt), matches: [] }; days.push(group); }
      group.matches.push(m);
    });
  return days;
}

function finalResult(match){
  if (!match.matchIsFinished || !match.matchResults || !match.matchResults.length) return null;
  const endergebnis = match.matchResults.find(r => r.resultTypeID === 2) || match.matchResults[match.matchResults.length - 1];
  return endergebnis.pointsTeam1 + ':' + endergebnis.pointsTeam2;
}

function isLiveNow(match){
  if (match.matchIsFinished) return false;
  const start = new Date(match.matchDateTime).getTime();
  const now = Date.now();
  return now >= start && now <= start + 125 * 60 * 1000;
}

function crest(team){
  return team.teamIconUrl ? `<img src="${team.teamIconUrl}" alt="" onerror="this.style.display='none'">` : '';
}

async function ensureLeagueData(lg){
  if (cache[lg]) return cache[lg];
  const season = currentSeason();
  const currentGroup = await fetchJSON(`${API}/getcurrentgroup/${lg}`);
  cache[lg] = { season, currentOrderId: currentGroup.groupOrderID, groups: {}, table: null };
  return cache[lg];
}

async function ensureGroupMatches(lg, orderId){
  const state = cache[lg];
  if (state.groups[orderId]) return state.groups[orderId];
  const matches = await fetchJSON(`${API}/getmatchdata/${lg}/${state.season}/${orderId}`);
  const label = matches.length ? matches[0].group.groupName : ('Spieltag ' + orderId);
  state.groups[orderId] = { label, matches };
  return state.groups[orderId];
}

async function ensureTableRows(lg){
  const state = cache[lg];
  if (state.tableRows) return state.tableRows;
  try {
    state.tableRows = await fetchJSON(`${API}/getbltable/${lg}/${state.season}`);
  } catch (e) {
    state.tableRows = [];
  }
  return state.tableRows;
}

async function ensureTable(lg){
  const state = cache[lg];
  if (state.table) return state.table;
  const rows = await ensureTableRows(lg);
  const table = {};
  rows.forEach((row, idx) => {
    const id = row.teamInfoId ?? row.teamId;
    if (id != null) table[id] = idx + 1;
  });
  state.table = table;
  return table;
}

function rankBadge(table, team){
  const rank = table[team.teamId];
  return rank ? `<span class="rank">${rank}.</span>` : '';
}

function setStatus(html, isError){
  document.getElementById('content').innerHTML = `<div class="status${isError ? ' error' : ''}">${html}</div>`;
}

function applyTheme(){
  document.body.classList.remove('theme-cup', 'theme-nt');
  document.body.classList.toggle('theme-bl2', league === 'bl2');
  document.getElementById('page-sub').textContent = `${LEAGUE_NAMES[league]} · im Design ${league === 'bl1' ? 'des' : 'von'} ${THEME_CLUB[league]}`;
}

function updateClubLogo(matches){
  const logo = document.getElementById('club-logo');
  const needle = THEME_MATCH[league];
  const flat = [];
  matches.forEach(m => { flat.push(m.team1, m.team2); });
  const club = flat.find(t => t.teamName && t.teamName.includes(needle));
  if (club && club.teamIconUrl) {
    logo.src = club.teamIconUrl;
    logo.style.display = 'block';
  } else {
    logo.style.display = 'none';
  }
}

async function loadAndRender(){
  applyTheme();
  const content = document.getElementById('content');
  content.innerHTML = `<div class="status"><span class="spinner"></span>Lade aktuelle Ansetzungen …</div>`;

  try {
    const state = await ensureLeagueData(league);
    const orderId = weekend === 'current' ? state.currentOrderId : state.currentOrderId + 1;
    const [group, table] = await Promise.all([
      ensureGroupMatches(league, orderId),
      ensureTable(league)
    ]);

    if (!group.matches.length) {
      setStatus(`Für ${weekend === 'current' ? 'den aktuellen' : 'den nächsten'} Spieltag liegen für die ${LEAGUE_NAMES[league]} noch keine Ansetzungen vor.`);
      return;
    }

    updateClubLogo(group.matches);

    const days = groupMatchesByDay(group.matches);
    content.innerHTML = '';

    const intro = document.createElement('div');
    intro.className = 'note';
    intro.style.marginBottom = '18px';
    intro.textContent = `${group.label} · ${LEAGUE_NAMES[league]}`;
    content.appendChild(intro);

    days.forEach(day => {
      const dgroup = document.createElement('div');
      dgroup.className = 'day-group';

      const heading = document.createElement('div');
      heading.className = 'day-heading';
      heading.innerHTML = `<span class="name">${day.name}</span><span class="date">${day.date}</span><span class="rule"></span>`;
      dgroup.appendChild(heading);

      day.matches.forEach(m => {
        const dt = new Date(m.matchDateTime);
        const final = finalResult(m);
        const live = isLiveNow(m);
        const isFeatured = [m.team1, m.team2].some(t => t.teamName && t.teamName.includes(THEME_MATCH[league]));
        const row = document.createElement('div');
        row.className = 'match' + (isFeatured ? ' featured' : '');

        let kickoffClass = 'kickoff';
        let main = timeLabel(dt);
        let tag = 'Uhr';
        if (final) { kickoffClass += ' final'; main = final; tag = 'Endstand'; }
        else if (live) { kickoffClass += ' live'; tag = 'live'; }

        row.innerHTML = `
          <div class="team home">${rankBadge(table, m.team1)}${crest(m.team1)}<span>${m.team1.teamName}</span></div>
          <div class="${kickoffClass}">${main}<span class="tag">${tag}</span></div>
          <div class="team away"><span>${m.team2.teamName}</span>${crest(m.team2)}${rankBadge(table, m.team2)}</div>
        `;
        dgroup.appendChild(row);
      });

      content.appendChild(dgroup);
    });

    document.getElementById('updated-at').textContent =
      'Zuletzt aktualisiert: ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }) + ' Uhr';

  } catch (err) {
    console.error(err);
    setStatus(
      `Die Daten von OpenLigaDB (api.openligadb.de) konnten gerade nicht geladen werden. ` +
      `Das kann an einer Netzwerksperre oder einer kurzzeitigen Störung der Quelle liegen.` +
      `<br><button class="retry" onclick="loadAndRender()">Erneut versuchen</button>`,
      true
    );
    document.getElementById('updated-at').textContent = 'Aktualisierung fehlgeschlagen';
  }
}

async function loadTableAndRender(){
  applyTheme();
  const content = document.getElementById('content');
  content.innerHTML = `<div class="status"><span class="spinner"></span>Lade Tabelle …</div>`;

  try {
    await ensureLeagueData(league);
    const rows = await ensureTableRows(league);

    if (!rows.length) {
      setStatus(
        `Die Tabelle der ${LEAGUE_NAMES[league]} konnte gerade nicht geladen werden.` +
        `<br><button class="retry" onclick="loadTableAndRender()">Erneut versuchen</button>`,
        true
      );
      return;
    }

    const clubRow = rows.find(r => r.teamName && r.teamName.includes(THEME_MATCH[league]));
    const logo = document.getElementById('club-logo');
    if (clubRow && clubRow.teamIconUrl) { logo.src = clubRow.teamIconUrl; logo.style.display = 'block'; }
    else { logo.style.display = 'none'; }

    content.innerHTML = '';

    const intro = document.createElement('div');
    intro.className = 'note';
    intro.style.marginBottom = '10px';
    intro.textContent = `Tabelle · ${LEAGUE_NAMES[league]}`;
    content.appendChild(intro);

    const head = document.createElement('div');
    head.className = 'table-head';
    head.innerHTML = `<span></span><span></span><span>Verein</span><span class="num">Sp</span><span class="num">TD</span><span class="num">Pkt</span>`;
    content.appendChild(head);

    rows.forEach((row, idx) => {
      const name = row.teamName || '';
      const isFeatured = name.includes(THEME_MATCH[league]);
      const el = document.createElement('div');
      el.className = 'table-row' + (isFeatured ? ' featured' : '');
      const icon = row.teamIconUrl ? `<img src="${row.teamIconUrl}" alt="" onerror="this.style.display='none'">` : '<span></span>';
      const diffNum = row.goalDiff ?? (row.goals - row.opponentGoals);
      const diff = (diffNum > 0 ? '+' : '') + diffNum;
      el.innerHTML = `
        <span class="rank">${idx + 1}</span>
        ${icon}
        <span class="name">${name}</span>
        <span class="num">${row.matches}</span>
        <span class="num">${diff}</span>
        <span class="pts">${row.points}</span>
      `;
      content.appendChild(el);
    });

    document.getElementById('updated-at').textContent =
      'Zuletzt aktualisiert: ' + timeLabel(new Date()) + ' Uhr';

  } catch (err) {
    console.error(err);
    setStatus(
      `Die Daten von OpenLigaDB (api.openligadb.de) konnten gerade nicht geladen werden.` +
      `<br><button class="retry" onclick="loadTableAndRender()">Erneut versuchen</button>`,
      true
    );
    document.getElementById('updated-at').textContent = 'Aktualisierung fehlgeschlagen';
  }
}

async function loadNationalTeamAndRender(){
  document.body.classList.remove('theme-bl2');
  document.body.classList.add('theme-nt');
  document.getElementById('club-logo').style.display = 'none';
  document.getElementById('page-sub').textContent = 'Herren-Nationalmannschaft · Schwarz-Rot-Gold';

  const content = document.getElementById('content');
  content.innerHTML = `<div class="status"><span class="spinner"></span>Suche Länderspiele …</div>`;

  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0, 0, 0, 0);
  const season = currentSeason();
  const NEEDLE = 'Deutschland';
  const MAX_MATCHES = 4;

  let collected = [];

  async function pull(shortcut, label){
    try {
      const matches = await fetchJSON(`${API}/getmatchdata/${shortcut}/${season}`);
      matches.forEach(m => {
        const dt = new Date(m.matchDateTime);
        if (dt < startOfToday) return;
        const hit = (m.team1.teamName && m.team1.teamName.includes(NEEDLE)) ||
                    (m.team2.teamName && m.team2.teamName.includes(NEEDLE));
        if (!hit) return;
        collected.push({ match: m, competition: label });
      });
    } catch (e) { /* Kandidat existiert nicht oder ist gerade nicht erreichbar - einfach überspringen */ }
  }

  // "nla" (dedizierte Nations-League-Liga) zuerst geprüft, da "DFBN" für diese beiden
  // Termine offenbar noch nicht bestätigte Anstoßzeiten enthält.
  const candidates = [
    { shortcut: 'nla', label: 'UEFA Nations League' },
    { shortcut: 'DFBN', label: 'DFB-Länderspiel' },
    { shortcut: 'FTS', label: 'Freundschaftsspiel' }
  ];
  for (const c of candidates) await pull(c.shortcut, c.label);

  const seen = new Set();
  collected = collected
    .filter(item => {
      // Nach Kalendertag + Team-Paarung entdoppeln (nicht nach exakter Uhrzeit) - so werden
      // auch Fälle erkannt, in denen zwei OpenLigaDB-Ligen dasselbe Spiel mit leicht
      // unterschiedlicher Anstoßzeit führen. Bei einem Treffer gewinnt der zuerst geprüfte,
      // höher priorisierte Kandidat (DFBN vor nla vor FTS).
      const dt = new Date(item.match.matchDateTime);
      const dayKey = dt.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
      const teams = [item.match.team1?.teamName || '', item.match.team2?.teamName || ''].sort().join('|');
      const key = `${dayKey}::${teams}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort((a, b) => new Date(a.match.matchDateTime) - new Date(b.match.matchDateTime))
    .slice(0, MAX_MATCHES);

  if (!collected.length) {
    content.innerHTML = `<div class="status">Aktuell sind keine anstehenden Länderspiele der deutschen Nationalmannschaft bekannt ` +
      `(die Datenabdeckung für Länderspiele bei OpenLigaDB ist eingeschränkt - falls das öfter vorkommt, sag Bescheid).` +
      `<br><button class="retry" onclick="loadNationalTeamAndRender()">Erneut versuchen</button></div>`;
    document.getElementById('updated-at').textContent = 'Zuletzt aktualisiert: ' + timeLabel(new Date()) + ' Uhr';
    return;
  }

  content.innerHTML = '';
  const intro = document.createElement('div');
  intro.className = 'note';
  intro.style.marginBottom = '18px';
  intro.textContent = `Nächste ${collected.length} Länderspiele · Deutschland`;
  content.appendChild(intro);

  const days = [];
  collected.forEach(item => {
    const dt = new Date(item.match.matchDateTime);
    let g = days.find(d => isSameBerlinDay(d.refDate, dt));
    if (!g) { g = { refDate: dt, name: dayName(dt), date: dayDate(dt), items: [] }; days.push(g); }
    g.items.push(item);
  });

  days.forEach(day => {
    const dgroup = document.createElement('div');
    dgroup.className = 'day-group';
    const heading = document.createElement('div');
    heading.className = 'day-heading';
    heading.innerHTML = `<span class="name">${day.name}</span><span class="date">${day.date}</span><span class="rule"></span>`;
    dgroup.appendChild(heading);

    day.items.forEach(item => {
      const m = item.match;
      const dt = new Date(m.matchDateTime);
      const final = finalResult(m);
      const live = isLiveNow(m);

      let kickoffClass = 'kickoff';
      let main = timeLabel(dt);
      let tag = 'Uhr';
      if (final) { kickoffClass += ' final'; main = final; tag = 'Endstand'; }
      else if (live) { kickoffClass += ' live'; tag = 'live'; }

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `
        <div class="comp-label">${item.competition}</div>
        <div class="match">
          <div class="team home">${crest(m.team1)}<span>${m.team1.teamName}</span></div>
          <div class="${kickoffClass}">${main}<span class="tag">${tag}</span></div>
          <div class="team away"><span>${m.team2.teamName}</span>${crest(m.team2)}</div>
        </div>
      `;
      dgroup.appendChild(wrapper);
    });

    content.appendChild(dgroup);
  });

  document.getElementById('updated-at').textContent = 'Zuletzt aktualisiert: ' + timeLabel(new Date()) + ' Uhr';
}

async function loadCupAndRender(){
  document.body.classList.remove('theme-bl2');
  document.body.classList.add('theme-cup');
  document.getElementById('club-logo').style.display = 'none';
  document.getElementById('page-sub').textContent = 'DFB-Pokal & Champions League · FC Bayern München und SV Darmstadt 98';

  const content = document.getElementById('content');
  content.innerHTML = `<div class="status"><span class="spinner"></span>Suche Pokal- und Europapokalspiele …</div>`;

  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0);
  const season = currentSeason();
  const MIN_MATCHES_PER_CLUB = 3;
  const needles = [
    { needle: 'Bayern', club: 'bayern' },
    { needle: 'Darmstadt', club: 'darmstadt' }
  ];

  let collected = [];
  let anySourceFailed = false;

  async function pull(shortcut, label){
    try {
      const matches = await fetchJSON(`${API}/getmatchdata/${shortcut}/${season}`);
      matches.forEach(m => {
        const dt = new Date(m.matchDateTime);
        if (dt < startOfToday) return;
        const hit = needles.find(n =>
          (m.team1.teamName && m.team1.teamName.includes(n.needle)) ||
          (m.team2.teamName && m.team2.teamName.includes(n.needle))
        );
        if (!hit) return;
        collected.push({ match: m, club: hit.club, competition: label });
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  if (!(await pull('dfb', 'DFB-Pokal'))) anySourceFailed = true;

  // Champions League liegt bei OpenLigaDB je nach Saison unter verschiedenen Kürzeln vor
  // (teils mehrere parallele Einträge). Deshalb werden alle Kandidaten abgefragt und
  // anschließend über die matchID dedupliziert, statt beim ersten Treffer abzubrechen.
  const clCandidates = ['ucl', `ucl${season}`, `ucl${String(season).slice(-2)}`, `cl${season}`];
  let clOk = false;
  for (const shortcut of clCandidates) {
    const before = collected.length;
    await pull(shortcut, 'UEFA Champions League');
    if (collected.length > before) clOk = true;
  }

  // Duplikate entfernen (dasselbe Spiel kann über mehrere Liga-Kürzel geliefert werden) -
  // nach Kalendertag + Team-Paarung statt exakter Uhrzeit, da diese zwischen den Quellen abweichen kann.
  const seen = new Set();
  collected = collected.filter(item => {
    const dt = new Date(item.match.matchDateTime);
    const dayKey = dt.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
    const teams = [item.match.team1?.teamName || '', item.match.team2?.teamName || ''].sort().join('|');
    const key = `${dayKey}::${teams}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  // Statt eines starren Zeitfensters: je Verein die nächsten anstehenden Spiele nehmen,
  // damit auch bei größeren Pausen zwischen den Runden mindestens zwei Termine sichtbar bleiben.
  collected.sort((a, b) => new Date(a.match.matchDateTime) - new Date(b.match.matchDateTime));
  const perClub = { bayern: [], darmstadt: [] };
  collected.forEach(item => {
    if (perClub[item.club].length < MIN_MATCHES_PER_CLUB) perClub[item.club].push(item);
  });
  collected = [...perClub.bayern, ...perClub.darmstadt]
    .sort((a, b) => new Date(a.match.matchDateTime) - new Date(b.match.matchDateTime));

  if (!collected.length) {
    content.innerHTML = `<div class="status">Für FC Bayern München und SV Darmstadt 98 sind aktuell keine DFB-Pokal- oder Champions-League-Spiele bekannt` +
      `${anySourceFailed || !clOk ? ' (ein Teil der Quellen war gerade nicht abrufbar oder deckt die aktuelle Saison nicht ab)' : ''}.</div>`;
    document.getElementById('updated-at').textContent = 'Zuletzt aktualisiert: ' + timeLabel(new Date()) + ' Uhr';
    return;
  }

  content.innerHTML = '';
  const intro = document.createElement('div');
  intro.className = 'note';
  intro.style.marginBottom = '18px';
  intro.textContent = 'Nächste Pokal- & Europapokalspiele je Verein (bis zu 3)';
  content.appendChild(intro);

  const days = [];
  collected.forEach(item => {
    const dt = new Date(item.match.matchDateTime);
    let g = days.find(d => isSameBerlinDay(d.refDate, dt));
    if (!g) { g = { refDate: dt, name: dayName(dt), date: dayDate(dt), items: [] }; days.push(g); }
    g.items.push(item);
  });

  days.forEach(day => {
    const dgroup = document.createElement('div');
    dgroup.className = 'day-group';
    const heading = document.createElement('div');
    heading.className = 'day-heading';
    heading.innerHTML = `<span class="name">${day.name}</span><span class="date">${day.date}</span><span class="rule"></span>`;
    dgroup.appendChild(heading);

    day.items.forEach(item => {
      const m = item.match;
      const dt = new Date(m.matchDateTime);
      const final = finalResult(m);
      const live = isLiveNow(m);
      const clubClass = item.club === 'bayern' ? 'club-bayern' : 'club-darmstadt';

      let kickoffClass = 'kickoff ' + clubClass;
      let main = timeLabel(dt);
      let tag = 'Uhr';
      if (final) { kickoffClass = 'kickoff final'; main = final; tag = 'Endstand'; }
      else if (live) { kickoffClass = 'kickoff live'; tag = 'live'; }

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `
        <div class="comp-label ${clubClass}">${item.competition}</div>
        <div class="match">
          <div class="team home">${crest(m.team1)}<span>${m.team1.teamName}</span></div>
          <div class="${kickoffClass}">${main}<span class="tag">${tag}</span></div>
          <div class="team away"><span>${m.team2.teamName}</span>${crest(m.team2)}</div>
        </div>
      `;
      dgroup.appendChild(wrapper);
    });

    content.appendChild(dgroup);
  });

  document.getElementById('updated-at').textContent = 'Zuletzt aktualisiert: ' + timeLabel(new Date()) + ' Uhr';
}

function refreshView(){
  if (weekend === 'cup') loadCupAndRender();
  else if (weekend === 'table') loadTableAndRender();
  else if (weekend === 'nt') loadNationalTeamAndRender();
  else loadAndRender();
}

function setActiveTab(id){
  ['btn-current', 'btn-next', 'btn-table', 'btn-cup', 'btn-nt'].forEach(btnId =>
    document.getElementById(btnId).classList.toggle('active', btnId === id)
  );
  document.getElementById('league-toggle-row').classList.toggle('hidden', id === 'btn-cup' || id === 'btn-nt');
}

function wireControls(){
  document.getElementById('btn-bl1').addEventListener('click', () => {
    league = 'bl1';
    document.getElementById('btn-bl1').classList.add('active');
    document.getElementById('btn-bl2').classList.remove('active');
    refreshView();
  });
  document.getElementById('btn-bl2').addEventListener('click', () => {
    league = 'bl2';
    document.getElementById('btn-bl2').classList.add('active');
    document.getElementById('btn-bl1').classList.remove('active');
    refreshView();
  });
  document.getElementById('btn-current').addEventListener('click', () => {
    weekend = 'current';
    setActiveTab('btn-current');
    loadAndRender();
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    weekend = 'next';
    setActiveTab('btn-next');
    loadAndRender();
  });
  document.getElementById('btn-table').addEventListener('click', () => {
    weekend = 'table';
    setActiveTab('btn-table');
    loadTableAndRender();
  });
  document.getElementById('btn-cup').addEventListener('click', () => {
    weekend = 'cup';
    setActiveTab('btn-cup');
    loadCupAndRender();
  });
  document.getElementById('btn-nt').addEventListener('click', () => {
    weekend = 'nt';
    setActiveTab('btn-nt');
    loadNationalTeamAndRender();
  });
  document.getElementById('refresh-btn').addEventListener('click', () => {
    cache = { bl1: null, bl2: null };
    refreshView();
  });
}

wireControls();
refreshView();

setInterval(() => {
  cache = { bl1: null, bl2: null };
  refreshView();
}, 3 * 60 * 1000);

// Wischgesten: links/rechts wischen wechselt zwischen den vier Reitern
const TAB_ORDER = ['btn-current', 'btn-next', 'btn-table', 'btn-cup', 'btn-nt'];
function currentTabIndex(){
  const map = { current: 0, next: 1, table: 2, cup: 3, nt: 4 };
  return map[weekend] ?? 0;
}

let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!e.changedTouches || e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const THRESHOLD = 55;
  // Nur reagieren, wenn die Bewegung deutlich horizontal ist - sonst mit normalem Scrollen kollidieren
  if (Math.abs(dx) < THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.4) return;

  const idx = currentTabIndex();
  if (dx < 0 && idx < TAB_ORDER.length - 1) {
    document.getElementById(TAB_ORDER[idx + 1]).click(); // nach links wischen -> nächster Reiter
  } else if (dx > 0 && idx > 0) {
    document.getElementById(TAB_ORDER[idx - 1]).click(); // nach rechts wischen -> vorheriger Reiter
  }
}, { passive: true });
</script>
